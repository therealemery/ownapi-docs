name: Build Docs Image

# Builds the docs image and pushes it to GHCR. The Lightsail host only ever
# pulls this image — it never builds (see 运维.md 部署铁律).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'LEGAL.md'
  schedule:
    # Refresh the prebuild-generated changelog every 6 hours, same cadence as
    # the legacy Vercel deploy hook.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/therealemery/ownapi-docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Shallow history is enough; lastModifiedTime: 'git' resolves per file
        # against the available commits.
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SITE_URL=https://docs.ownapi.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package publicly pullable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/ownapi-docs \
            -f visibility=public \
            && echo "package is now public" \
            || echo "could not set package visibility — flip it manually in GitHub → Packages → ownapi-docs → Settings"
